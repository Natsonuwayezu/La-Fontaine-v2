<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ECOLE LA FONTAINE — School Management System</title>
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#d97706">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EcoleFontaine">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* ==================================================================================
           SECTION 1 — CSS VARIABLES & THEMING (Complete)
        ================================================================================== */
        :root {
            /* Base colors */
            --bg-primary: #eef2f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f4f7fa;
            --bg-hover: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --text-white: #ffffff;
            --border-light: #e2e8f0;
            --border-medium: #cbd5e1;
            --border-dark: #94a3b8;

            /* Role colors - Holiday default */
            --role-primary: #d97706;
            --role-secondary: #f59e0b;
            --role-tertiary: #fbbf24;
            --role-accent: #22c55e;
            --role-light: rgba(217, 119, 6, 0.08);
            --role-dark: #b45309;
            --role-gradient: linear-gradient(135deg, #d97706, #f59e0b);

            /* Status colors */
            --success: #10b981;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --warning: #f59e0b;
            --warning-bg: #fef3c7;
            --warning-text: #92400e;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
            --info: #3b82f6;
            --info-bg: #dbeafe;
            --info-text: #1e40af;

            /* Spacing */
            --xs: 4px;
            --sm: 8px;
            --md: 16px;
            --lg: 24px;
            --xl: 32px;
            --xxl: 48px;
            --xxxl: 64px;

            /* Radius */
            --r-sm: 4px;
            --r-md: 8px;
            --r-lg: 12px;
            --r-xl: 16px;
            --r-xxl: 20px;
            --r-full: 9999px;

            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, .1), 0 2px 4px -1px rgba(0, 0, 0, .06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, .1), 0 4px 6px -2px rgba(0, 0, 0, .05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, .1), 0 10px 10px -5px rgba(0, 0, 0, .04);
            --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, .25);

            /* Transitions */
            --transition: .2s ease;
            --transition-slow: .4s ease;
            --transition-fast: .1s ease;

            /* Layout */
            --sidebar-w: 280px;
            --topbar-h: 64px;
            --max-width: 1440px;

            /* Fonts */
            --font-primary: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-heading: 'Syne', sans-serif;
        }

        /* ==================================================================================
           SECTION 2 — THEME VARIATIONS (Complete)
        ================================================================================== */

        /* Holiday Theme (Default) */
        .theme-holiday {
            --role-primary: #d97706;
            --role-secondary: #f59e0b;
            --role-tertiary: #fbbf24;
            --role-light: rgba(217, 119, 6, 0.08);
            --role-dark: #b45309;
            --role-gradient: linear-gradient(135deg, #d97706, #f59e0b);
        }

        /* Admin Theme */
        .theme-admin {
            --role-primary: #1a3a5c;
            --role-secondary: #3b82f6;
            --role-tertiary: #60a5fa;
            --role-light: rgba(26, 58, 92, 0.08);
            --role-dark: #0f2a45;
            --role-gradient: linear-gradient(135deg, #1a3a5c, #3b82f6);
        }

        /* Accountant Theme */
        .theme-accountant {
            --role-primary: #0d9488;
            --role-secondary: #14b8a6;
            --role-tertiary: #2dd4bf;
            --role-light: rgba(13, 148, 136, 0.08);
            --role-dark: #0f766e;
            --role-gradient: linear-gradient(135deg, #0d9488, #14b8a6);
        }

        /* Teacher Theme */
        .theme-teacher {
            --role-primary: #7c3aed;
            --role-secondary: #8b5cf6;
            --role-tertiary: #a78bfa;
            --role-light: rgba(124, 58, 237, 0.08);
            --role-dark: #5b21b6;
            --role-gradient: linear-gradient(135deg, #7c3aed, #8b5cf6);
        }

        /* Success Theme (Next Year) */
        .theme-success {
            --role-primary: #0d9488;
            --role-secondary: #14b8a6;
            --role-tertiary: #2dd4bf;
            --role-light: rgba(13, 148, 136, 0.08);
            --role-dark: #0f766e;
            --role-gradient: linear-gradient(135deg, #0d9488, #14b8a6);
        }

        /* Dark Mode */
        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --bg-hover: #2d3a4f;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-light: #334155;
            --border-medium: #475569;
            --border-dark: #64748b;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, .4);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, .4);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, .4);
        }

        /* Dark mode theme overrides */
        [data-theme="dark"] .theme-holiday {
            --role-primary: #f59e0b;
            --role-secondary: #fbbf24;
            --role-light: rgba(245, 158, 11, 0.15);
            --role-gradient: linear-gradient(135deg, #d97706, #f59e0b);
        }

        [data-theme="dark"] .theme-admin {
            --role-primary: #2d5a8e;
            --role-secondary: #60a5fa;
            --role-light: rgba(45, 90, 142, 0.2);
            --role-gradient: linear-gradient(135deg, #1a3a5c, #3b82f6);
        }

        [data-theme="dark"] .theme-success {
            --role-primary: #14b8a6;
            --role-secondary: #2dd4bf;
            --role-light: rgba(20, 184, 166, 0.15);
            --role-gradient: linear-gradient(135deg, #0d9488, #14b8a6);
        }

        /* ==================================================================================
           SECTION 3 — RESET & BASE STYLES (Complete)
        ================================================================================== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-primary);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background var(--transition), color var(--transition);
        }

        /* Typography */
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: var(--font-heading);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: var(--md);
        }

        h1 {
            font-size: 2rem;
        }

        h2 {
            font-size: 1.5rem;
        }

        h3 {
            font-size: 1.2rem;
        }

        h4 {
            font-size: 1rem;
        }

        h5 {
            font-size: .9rem;
        }

        h6 {
            font-size: .8rem;
        }

        a {
            color: var(--info);
            text-decoration: none;
            transition: color var(--transition);
        }

        a:hover {
            color: var(--role-primary);
        }

        ul,
        ol {
            list-style: none;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Form elements */
        input,
        select,
        textarea,
        button {
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }

        :focus-visible {
            outline: 2px solid var(--role-primary);
            outline-offset: 2px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: var(--r-full);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: var(--r-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-dark);
        }

        /* Selection */
        ::selection {
            background: var(--role-primary);
            color: #fff;
        }

        /* ==================================================================================
           SECTION 4 — LOGIN PAGE (Complete)
        ================================================================================== */
        #login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: var(--bg-primary);
            position: relative;
        }

        .particles-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--role-secondary), var(--role-primary));
            opacity: .12;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }

            10% {
                opacity: .12;
            }

            90% {
                opacity: .12;
            }

            100% {
                transform: translateY(-100vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        .login-scene {
            perspective: 1800px;
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            padding: var(--md);
        }

        .card-wrap {
            position: relative;
            width: 260px;
            height: 120px;
            margin: 0 auto;
            transform-style: preserve-3d;
            animation: floaty 4s ease-in-out infinite;
            transition: width .9s cubic-bezier(.22, 1, .36, 1), height .9s cubic-bezier(.22, 1, .36, 1);
        }

        .card-wrap.open {
            width: 100%;
            height: 580px;
        }

        .neon-border {
            position: absolute;
            inset: -3px;
            border-radius: 28px;
            overflow: hidden;
            z-index: 0;
        }

        .neon-border::before {
            content: '';
            position: absolute;
            width: 180%;
            height: 180%;
            background: conic-gradient(from 0deg,
                    transparent, var(--role-secondary), transparent,
                    var(--role-primary), transparent, var(--role-accent),
                    transparent, var(--role-secondary));
            top: -40%;
            left: -40%;
            animation: spinBorder 8s linear infinite;
        }

        @keyframes spinBorder {
            to {
                transform: rotate(360deg);
            }
        }

        .login-card {
            position: absolute;
            inset: 0;
            border-radius: 25px;
            background: rgba(255, 255, 255, .88);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(200, 212, 220, .5);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            z-index: 1;
        }

        [data-theme="dark"] .login-card {
            background: rgba(25, 35, 50, .92);
            border-color: rgba(70, 90, 110, .4);
        }

        .fold-cover {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, #1a3a5c, #0d2a45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transform-origin: left;
            transition: transform 1s cubic-bezier(.22, 1, .36, 1), opacity .5s ease;
            border-radius: 25px;
            cursor: pointer;
        }

        .card-wrap.open .fold-cover {
            transform: rotateY(-140deg);
            opacity: 0;
            pointer-events: none;
        }

        .cover-title {
            color: #fff;
            font-family: var(--font-heading);
            letter-spacing: 4px;
            font-size: 20px;
            text-shadow: 0 0 20px rgba(var(--role-primary), .6);
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        .cover-emoji {
            font-size: 28px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        .login-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            opacity: 0;
            transform: scale(.85);
            transition: opacity .6s ease .2s, transform .7s ease .1s;
        }

        .card-wrap.open .login-content {
            opacity: 1;
            transform: scale(1);
        }

        .logo-box {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: var(--role-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
            flex-shrink: 0;
        }

        .logo-box span {
            font-size: 40px;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
        }

        .school-name {
            font-family: var(--font-heading);
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 4px;
            background: var(--role-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .login-subtitle {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 22px;
            text-align: center;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .login-field input,
        .login-field select {
            width: 100%;
            padding: 13px 16px;
            border-radius: 14px;
            border: 1px solid rgba(200, 212, 220, .5);
            background: rgba(255, 255, 255, .7);
            color: var(--text-primary);
            outline: none;
            font-size: 14px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        [data-theme="dark"] .login-field input,
        [data-theme="dark"] .login-field select {
            background: rgba(35, 45, 60, .7);
            border-color: rgba(70, 90, 110, .5);
            color: var(--text-primary);
        }

        .login-field input:focus,
        .login-field select:focus {
            border-color: var(--role-primary);
            box-shadow: 0 0 0 3px rgba(var(--role-primary), .12);
        }

        .pw-wrap {
            position: relative;
        }

        .pw-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            opacity: .5;
            background: none;
            border: none;
            font-size: 16px;
            padding: 4px;
        }

        .pw-toggle:hover {
            opacity: 1;
        }

        .login-btn {
            margin-top: 6px;
            padding: 14px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            background: var(--role-gradient);
            transition: all .3s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(var(--role-primary), .3);
        }

        .login-btn:disabled {
            opacity: .7;
            cursor: not-allowed;
            transform: none !important;
        }

        .spinner-sm {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, .3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        .login-alert {
            background: var(--danger-bg);
            color: var(--danger);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            display: none;
        }

        #username-field {
            display: none;
        }

        @keyframes floaty {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        /* ==================================================================================
           SECTION 5 — MAIN APP SHELL (Complete)
        ================================================================================== */
        #app-page {
            display: none;
            min-height: 100vh;
        }

        /* ---- SIDEBAR ---- */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--sidebar-w);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            z-index: 200;
            transition: transform var(--transition);
            overflow: hidden;
        }

        .sidebar-header {
            padding: var(--lg) var(--md);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: var(--sm);
            background: var(--role-gradient);
            color: #fff;
            flex-shrink: 0;
        }

        .sidebar-logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            overflow: hidden;
            background: rgba(255, 255, 255, .15);
            color: #fff;
        }

        .sidebar-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sidebar-school-name {
            font-family: var(--font-heading);
            font-size: .85rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }

        .sidebar-school-name small {
            font-family: var(--font-primary);
            font-weight: 400;
            opacity: .8;
            font-size: .7rem;
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: var(--sm) 0;
        }

        .nav-section {
            margin-bottom: var(--xs);
        }

        .nav-section-title {
            font-size: .65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            padding: var(--sm) var(--md) var(--xs);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .nav-section-title:hover {
            color: var(--text-secondary);
        }

        .nav-section-arrow {
            transition: transform var(--transition);
            font-size: .6rem;
        }

        .nav-section.collapsed .nav-section-arrow {
            transform: rotate(-90deg);
        }

        .nav-section-items {
            overflow: hidden;
            transition: max-height .3s ease;
            max-height: 800px;
        }

        .nav-section.collapsed .nav-section-items {
            max-height: 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: var(--sm);
            padding: var(--sm) var(--md);
            cursor: pointer;
            border-radius: var(--r-md);
            margin: 1px var(--sm);
            font-size: .875rem;
            color: var(--text-secondary);
            transition: all var(--transition);
            white-space: nowrap;
            overflow: hidden;
        }

        .nav-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--role-light);
            color: var(--role-primary);
            font-weight: 600;
        }

        .nav-item .nav-icon {
            font-size: 1.1rem;
            flex-shrink: 0;
            width: 24px;
            text-align: center;
        }

        .sidebar-footer {
            padding: var(--md);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: var(--sm);
            flex-shrink: 0;
            background: var(--bg-secondary);
        }

        .sidebar-user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--role-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            color: #fff;
        }

        .sidebar-user-info {
            flex: 1;
            overflow: hidden;
            min-width: 0;
        }

        .sidebar-user-name {
            font-size: .8rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-user-role {
            font-size: .7rem;
            color: var(--text-muted);
            text-transform: capitalize;
        }

        .sidebar-logout {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-muted);
            padding: var(--xs);
            transition: color var(--transition);
        }

        .sidebar-logout:hover {
            color: var(--danger);
        }

        /* ---- MAIN CONTENT ---- */
        .main-content {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: margin-left var(--transition);
        }

        /* ---- TOPBAR ---- */
        .topbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-light);
            padding: 0 var(--xl);
            height: var(--topbar-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: var(--md);
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-secondary);
            display: none;
            padding: 4px;
        }

        .menu-toggle:hover {
            color: var(--text-primary);
        }

        .page-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            font-family: var(--font-heading);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: var(--lg);
        }

        /* Period Badge */
        .period-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: var(--r-full);
            font-size: .7rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }

        .period-holiday {
            background: #fef3c7;
            color: #92400e;
        }

        .period-last_year {
            background: #dbeafe;
            color: #1e40af;
        }

        .period-next_year {
            background: #d1fae5;
            color: #065f46;
        }

        .period-selector {
            position: relative;
            display: inline-block;
        }

        .period-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .period-option:hover {
            background: var(--bg-tertiary);
        }

        .period-option.active {
            background: var(--role-light);
        }

        .notif-bell {
            position: relative;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px;
        }

        .notif-dot {
            position: absolute;
            top: -3px;
            right: -5px;
            width: 9px;
            height: 9px;
            background: var(--danger);
            border-radius: 50%;
            display: none;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: var(--sm);
            cursor: pointer;
            padding: 6px var(--sm);
            border-radius: var(--r-md);
            transition: background var(--transition);
        }

        .user-menu:hover {
            background: var(--bg-tertiary);
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--role-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            flex-shrink: 0;
        }

        .user-name {
            font-size: .82rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .user-dropdown-arrow {
            font-size: .7rem;
            color: var(--text-muted);
        }

        .user-dropdown {
            position: absolute;
            top: 68px;
            right: var(--xl);
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--r-md);
            box-shadow: var(--shadow-lg);
            min-width: 200px;
            z-index: 300;
            overflow: hidden;
            display: none;
        }

        .user-dropdown.open {
            display: block;
        }

        .dropdown-item {
            padding: var(--sm) var(--md);
            cursor: pointer;
            font-size: .875rem;
            transition: background var(--transition);
            display: flex;
            align-items: center;
            gap: var(--sm);
        }

        .dropdown-item:hover {
            background: var(--bg-tertiary);
        }

        .dropdown-item.danger {
            color: var(--danger);
        }

        .dropdown-divider {
            border-top: 1px solid var(--border-light);
            margin: 4px 0;
        }

        .dropdown-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            cursor: default;
        }

        .dropdown-user-info:hover {
            background: var(--bg-tertiary);
        }

        .dropdown-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--role-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            flex-shrink: 0;
        }

        .dropdown-user-name {
            font-weight: 700;
            font-size: .9rem;
            color: var(--text-primary);
        }

        .dropdown-user-role {
            font-size: .7rem;
            color: var(--text-muted);
            text-transform: capitalize;
        }

        /* ---- SESSION PROGRESS BAR ---- */
        .session-progress-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-light);
            padding: var(--sm) var(--xl);
            display: flex;
            align-items: center;
            gap: var(--lg);
            flex-wrap: wrap;
            flex-shrink: 0;
            transition: background var(--transition);
        }

        .progress-label {
            font-size: .75rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-label strong {
            color: var(--role-primary);
        }

        .progress-bar-wrap {
            flex: 1;
            min-width: 120px;
            max-width: 400px;
        }

        .progress-track {
            height: 8px;
            background: var(--border-light);
            border-radius: var(--r-full);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: var(--r-full);
            background: var(--role-gradient);
            transition: width .5s ease;
        }

        .progress-text {
            font-size: .7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .progress-days {
            font-size: .75rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-days strong {
            color: var(--role-primary);
        }

        /* ---- DYNAMIC CONTENT ---- */
        #dynamic-content {
            flex: 1;
            padding: var(--lg) var(--xl);
            min-height: 400px;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--xxl);
            gap: var(--md);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-light);
            border-top-color: var(--role-primary);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ==================================================================================
           SECTION 6 — CARDS & STATS (Complete)
        ================================================================================== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: var(--md);
            margin-bottom: var(--lg);
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--r-lg);
            padding: var(--lg);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
            cursor: default;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .stat-icon {
            font-size: 1.8rem;
            margin-bottom: var(--sm);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            font-family: var(--font-heading);
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: .8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-trend {
            font-size: .72rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-trend.up {
            color: var(--success);
        }

        .stat-trend.down {
            color: var(--danger);
        }

        .stat-trend.neutral {
            color: var(--text-muted);
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--lg);
            margin-bottom: var(--lg);
        }

        .dash-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            margin-bottom: var(--lg);
        }

        .dash-card-header {
            padding: var(--md) var(--lg);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--sm);
            flex-wrap: wrap;
        }

        .dash-card-title {
            font-size: .95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--sm);
            margin: 0;
        }

        .dash-card-body {
            padding: var(--lg);
        }

        .dash-card-body.p-0 {
            padding: 0;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: var(--md);
        }

        .quick-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: var(--r-lg);
            padding: var(--lg) var(--md);
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
        }

        .quick-btn:hover {
            background: var(--role-light);
            border-color: var(--role-primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .quick-btn .qb-icon {
            font-size: 2rem;
            margin-bottom: var(--sm);
        }

        .quick-btn .qb-title {
            font-size: .82rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .quick-btn .qb-sub {
            font-size: .72rem;
            color: var(--text-muted);
        }

        /* ==================================================================================
           SECTION 7 — TABLES (Complete)
        ================================================================================== */
        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--r-md);
            -webkit-overflow-scrolling: touch;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .875rem;
        }

        .data-table thead tr {
            background: var(--bg-tertiary);
        }

        .data-table th {
            padding: var(--sm) var(--md);
            text-align: left;
            font-weight: 600;
            font-size: .7rem;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-light);
            white-space: nowrap;
            position: sticky;
            top: 0;
            background: var(--bg-tertiary);
            z-index: 10;
        }

        .data-table td {
            padding: var(--sm) var(--md);
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
        }

        .data-table tbody tr:hover {
            background: var(--bg-hover);
        }

        .data-table .alt-row {
            background: var(--bg-tertiary);
        }

        .data-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* ==================================================================================
           SECTION 8 — FORMS & INPUTS (Complete)
        ================================================================================== */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--md);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: .8rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 14px;
            border-radius: var(--r-md);
            border: 1px solid var(--border-medium);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: .875rem;
            transition: border-color var(--transition), box-shadow var(--transition);
            width: 100%;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--role-primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(var(--role-primary), .1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group .field-hint {
            font-size: .7rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ==================================================================================
           SECTION 9 — BUTTONS (Complete)
        ================================================================================== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: var(--sm) var(--lg);
            border-radius: var(--r-md);
            font-size: .875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            border: none;
            font-family: inherit;
            white-space: nowrap;
            text-decoration: none;
        }

        .btn-sm {
            padding: 4px var(--md);
            font-size: .78rem;
        }

        .btn-lg {
            padding: var(--md) var(--xl);
            font-size: 1rem;
        }

        .btn-xs {
            padding: 2px 8px;
            font-size: .7rem;
        }

        .btn-primary {
            background: var(--role-primary);
            color: #fff;
        }

        .btn-primary:hover {
            opacity: .9;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--border-light);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }

        .btn-warning {
            background: var(--warning);
            color: #fff;
        }

        .btn-warning:hover {
            background: #d97706;
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-medium);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            background: var(--bg-tertiary);
            border-color: var(--role-primary);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }

        .btn-ghost:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-group {
            display: flex;
            gap: var(--sm);
            flex-wrap: wrap;
            align-items: center;
        }

        /* ==================================================================================
           SECTION 10 — TABS (Complete)
        ================================================================================== */
        .tabs {
            display: flex;
            gap: 2px;
            border-bottom: 2px solid var(--border-light);
            margin-bottom: var(--lg);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s ease;
            white-space: nowrap;
            font-size: .85rem;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .tab-btn.active {
            color: var(--role-primary);
            border-bottom-color: var(--role-primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ==================================================================================
           SECTION 11 — BADGES & LABELS (Complete)
        ================================================================================== */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: var(--r-full);
            font-size: .68rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .badge-success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .badge-warning {
            background: var(--warning-bg);
            color: var(--warning-text);
        }

        .badge-danger {
            background: var(--danger-bg);
            color: var(--danger-text);
        }

        .badge-info {
            background: var(--info-bg);
            color: var(--info-text);
        }

        .badge-neutral {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .badge-primary {
            background: var(--role-light);
            color: var(--role-primary);
        }

        .grade-Ap,
        .grade-A {
            background: #d1fae5;
            color: #065f46;
        }

        .grade-B {
            background: #fef3c7;
            color: #92400e;
        }

        .grade-C {
            background: #ffedd5;
            color: #9a3412;
        }

        .grade-D {
            background: #fee2e2;
            color: #991b1b;
        }

        .grade-F {
            background: #fce7f3;
            color: #9d174d;
        }

        /* ==================================================================================
           SECTION 12 — MODALS (Complete)
        ================================================================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(3px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--lg);
            animation: fadeIn .2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            animation: slideUp .25s ease;
        }

        .modal-lg {
            max-width: 900px;
        }

        .modal-sm {
            max-width: 420px;
        }

        .modal-xl {
            max-width: 1200px;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: var(--lg);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .modal-header h3 {
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: color var(--transition);
            padding: 4px;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: var(--lg);
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: var(--md) var(--lg);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: flex-end;
            gap: var(--sm);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        /* ==================================================================================
           SECTION 13 — ALERTS & TOASTS (Complete)
        ================================================================================== */
        .alert {
            padding: var(--md) var(--lg);
            border-radius: var(--r-md);
            font-size: .875rem;
            margin-bottom: var(--md);
            display: flex;
            align-items: flex-start;
            gap: var(--sm);
            border-left: 4px solid transparent;
        }

        .alert-success {
            background: var(--success-bg);
            color: var(--success-text);
            border-left-color: var(--success);
        }

        .alert-warning {
            background: var(--warning-bg);
            color: var(--warning-text);
            border-left-color: var(--warning);
        }

        .alert-danger {
            background: var(--danger-bg);
            color: var(--danger-text);
            border-left-color: var(--danger);
        }

        .alert-info {
            background: var(--info-bg);
            color: var(--info-text);
            border-left-color: var(--info);
        }

        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: var(--sm);
            pointer-events: none;
            max-width: 400px;
            width: 100%;
        }

        .toast {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--r-lg);
            padding: var(--md) var(--lg);
            box-shadow: var(--shadow-lg);
            font-size: .875rem;
            animation: toastIn .3s ease;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: var(--sm);
            border-left: 4px solid var(--info);
        }

        .toast.hiding {
            animation: toastOut .3s ease forwards;
        }

        .toast-success {
            border-left-color: var(--success);
        }

        .toast-error {
            border-left-color: var(--danger);
        }

        .toast-warning {
            border-left-color: var(--warning);
        }

        .toast-info {
            border-left-color: var(--info);
        }

        @keyframes toastIn {
            from {
                transform: translateX(20px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes toastOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }

            to {
                transform: translateX(20px);
                opacity: 0;
            }
        }

        /* ==================================================================================
           SECTION 14 — PAGINATION (Complete)
        ================================================================================== */
        .pagination {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: var(--md);
            justify-content: center;
        }

        .page-btn {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--r-md);
            border: 1px solid var(--border-medium);
            background: var(--bg-secondary);
            cursor: pointer;
            font-size: .82rem;
            transition: all var(--transition);
        }

        .page-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--role-primary);
        }

        .page-btn.active {
            background: var(--role-primary);
            color: #fff;
            border-color: var(--role-primary);
        }

        /* ==================================================================================

            padding: var(--md);

        .marks-input:disabled {

            color: var(--text-muted);

            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-light);
            box-shadow: 0 4px 16px rgba(0, 0, 0, .08);

        .report-header {

        .report-info-item {

            display: flex;
            gap: var(--sm);
            flex-wrap: wrap;
            margin-bottom: var(--md);
        }

            display: flex;
            flex-direction: column;
            gap: var(--sm);
        }

        .att-row {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: var(--md);
            padding: var(--md);
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--r-lg);
            transition: all var(--transition);
        }

        .att-row:hover {
            border-color: var(--role-primary);
        }

        .att-row.absent {
            background: #fef2f2;
            border-color: #fecaca;
        }

        [data-theme="dark"] .att-row.absent {
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.3);
        }

            align-items: center;
            gap: var(--sm);

            font-size: .95rem;

            font-size: .75rem;
            font-weight: 700;

        .att-name .code {
            font-size: .7rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-left: 4px;
        }

        .att-toggle {
            display: inline-flex;
            background: var(--bg-tertiary);
            border-radius: var(--r-full);
            padding: 3px;
            gap: 3px;
        }

        .att-toggle button {
            border: none;
            background: transparent;
            padding: 10px 20px;
            border-radius: var(--r-full);
            cursor: pointer;
            font-weight: 600;
            font-size: .85rem;
            color: var(--text-secondary);
            transition: all var(--transition);
            min-width: 88px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .att-toggle button:hover {
            color: var(--text-primary);
        }

        .att-toggle button.present.active {
            background: var(--success);
            color: #fff;
            box-shadow: 0 2px 6px rgba(16, 185, 129, .35);
        }

        .att-toggle button.absent.active {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 2px 6px rgba(239, 68, 68, .35);
        }

        .att-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: var(--md);
            margin-bottom: var(--lg);
        }

        .att-summary .stat-card {
            padding: var(--md);
        }

        .att-summary .stat-value {
            font-size: 1.5rem;
        }

        .att-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: var(--r-full);
            font-size: .7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
        }

        .att-pill.present {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .att-pill.absent {
            background: var(--danger-bg);
            color: var(--danger-text);
        }

        .att-pill.unmarked {
            background: var(--bg-tertiary);
            color: var(--text-muted);
        }

        .att-sticky-save {
            position: sticky;
            bottom: 0;
            z-index: 20;
            background: var(--bg-primary);
            padding: var(--md) 0;
            border-top: 1px solid var(--border-light);
            display: flex;
            gap: var(--sm);
            flex-wrap: wrap;
            align-items: center;
            margin-top: var(--lg);
        }

        .att-sticky-save .btn-lg {
            min-width: 200px;
        }

        .att-unsaved {
            color: var(--warning);
            font-weight: 600;
            font-size: .8rem;
            margin-left: auto;
        }

        .att-perm-note {
            font-size: .8rem;
            color: var(--text-muted);
        }

        /* Mobile */

                min-width: 0;
                padding: 12px 8px;
                font-size: .82rem;

            }

            }

                flex: 1;
            }

                flex-wrap: wrap;
            }
        }
    
        /* Boot loader */
        #boot-loader {
            position: fixed; inset: 0; z-index: 9999;

            border-radius: 4px; transition: width .4s ease;
