<!--
    ECOLE LA FONTAINE — Sidebar Partial
    This is the HTML structure for the sidebar.
    JavaScript in js/ui/sidebar.js populates the nav items dynamically.
-->

<aside class="sidebar" id="sidebar">
    <!-- Header -->
    <div class="sidebar-header">
        <div class="sidebar-logo" id="sidebar-logo">🏫</div>
        <div class="sidebar-school-name">
            ECOLE LA FONTAINE
            <small id="sidebar-school-subtitle">School Management</small>
        </div>
    </div>

    <!-- Navigation (populated by JavaScript) -->
    <nav class="sidebar-nav" id="sidebar-nav">
        <div class="loading-container" style="padding:20px;">
            <div class="spinner" style="width:24px;height:24px;"></div>
            <p style="font-size:0.8rem;">Loading navigation...</p>
        </div>
    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
        <div class="sidebar-user-avatar" id="sidebar-avatar">👤</div>
        <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-username">User</div>
            <div class="sidebar-user-role" id="sidebar-userrole">Role</div>
        </div>
        <button class="sidebar-logout" title="Logout" onclick="window.logout()">🚪</button>
    </div>
</aside>

<!-- Mobile overlay -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="window.closeSidebarMobile()"></div>
