<!-- ============================================================ -->
<!-- THERMAL RECEIPT TEMPLATE (80mm)                              -->
<!-- Used by js/modules/finance/receipts.js                       -->
<!-- ============================================================ -->

<div id="receipt-container"
    style="font-family:'Courier New',monospace;width:350px;max-width:100%;margin:0 auto;background:#fff;padding:8px 12px;font-size:9.5px;line-height:1.25;color:#000;">

    <!-- Header -->
    <div style="text-align:center;border-bottom:1px dashed #999;padding-bottom:6px;margin-bottom:6px;">
        <div style="font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;"
            id="receipt-school-name">ECOLE LA FONTAINE</div>
        <div style="font-size:7px;color:#666;" id="receipt-address">Rubavu, Rwanda</div>
        <div style="font-size:8px;font-weight:600;margin-top:2px;">PAYMENT RECEIPT</div>
        <div style="font-size:8px;font-family:monospace;background:#f0f0f0;display:inline-block;padding:1px 5px;margin-top:2px;"
            id="receipt-number"># RCP-001</div>
    </div>

    <!-- Info -->
    <div style="margin:4px 0;">
        <div style="display:flex;justify-content:space-between;"><span style="font-weight:600;">Date:</span><span
                id="receipt-date">—</span></div>
        <div style="display:flex;justify-content:space-between;"><span style="font-weight:600;">Student:</span><span
                id="receipt-student-name">—</span></div>
        <div style="display:flex;justify-content:space-between;"><span style="font-weight:600;">Class:</span><span
                id="receipt-class">—</span></div>
        <div style="display:flex;justify-content:space-between;"><span style="font-weight:600;">Method:</span><span
                id="receipt-method">—</span></div>
    </div>

    <div style="border-top:1px dashed #999;margin:4px 0;"></div>

    <!-- Fee Rows -->
    <div id="receipt-fee-rows">
        <!-- Dynamically populated -->
        <div style="display:flex;justify-content:space-between;">
            <span>School Fees</span>
            <span>150,000</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding-left:8px;font-size:8px;color:#666;">
            <span>Paid: 50,000</span>
            <span>Balance: 100,000</span>
        </div>
    </div>

    <div style="border-top:1px dashed #999;margin:4px 0;"></div>

    <!-- Amount -->
    <div style="text-align:center;padding:4px 0;background:#d1fae5;border-radius:4px;margin:4px 0;">
        <span style="font-weight:700;font-size:12px;">TOTAL: <span id="receipt-amount">—</span> RWF</span>
    </div>

    <div style="border-top:1px dashed #999;margin:4px 0;"></div>

    <!-- Footer -->
    <div style="text-align:center;font-size:7px;color:#666;padding:4px 0;">
        <div>Thank you for your payment!</div>
        <div style="margin-top:2px;">📱 Scan QR to verify</div>
        <div style="margin-top:2px;font-size:6px;" id="receipt-generated">—</div>
    </div>

    <!-- QR Code -->
    <div style="text-align:center;padding:4px 0;">
        <img id="receipt-qr-image" src="" alt="QR" style="width:60px;height:60px;display:inline-block;">
    </div>
</div>
